<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Gift 🎁</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="sparkles"></div>

  <div class="container">

    <p class="subtitle">✨ A Special Gift For You ✨</p>

    <h1>Happy Birthday!</h1>

    <p class="name">Dear Friend ❤️</p>

    <div class="cake">🎂</div>

    <div class="gift-container">

      <div id="gift" class="gift" onclick="openGift()">

        <div class="lid"></div>

        <div class="box"></div>

        <div class="ribbon"></div>

      </div>

    </div>

    <button onclick="openGift()">
      Open Your Gift 🎁
    </button>

    <div id="letter" class="letter">

      <div class="letter-content">

        <h2>💌 A Birthday Message</h2>

        <p>
          Happy Birthday! 🎉
        </p>

        <p>
          May your day be filled with
          happiness, laughter and beautiful
          memories. ❤️
        </p>

        <p>
          Keep smiling and keep chasing
          your dreams. ✨
        </p>

        <p>
          I hope this year brings you
          many wonderful moments! 🎂
        </p>

        <div class="hearts">
          ❤️ 💕 💖 💗 ❤️
        </div>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
